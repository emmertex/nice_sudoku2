# Security headers and TLS notes:
# - TLS is expected to terminate at an upstream reverse proxy (e.g. Nginx Proxy Manager).
#   This container listens on HTTP only so local `docker compose` keeps working.
# - HSTS is emitted only when the proxy forwards X-Forwarded-Proto: https.
map $http_x_forwarded_proto $strict_transport_security {
    https "max-age=31536000; includeSubDomains";
    default "";
}

# Prefer an upstream proxy's proto when present; otherwise use the connection scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~.+" $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reject oversized API bodies early (matches backend MAX_REQUEST_BODY_BYTES).
    client_max_body_size 64k;

    # Baseline security headers for all responses from this server block.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security $strict_transport_security always;

    # Compress text assets (the web.js bundle is large).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml application/manifest+json;

    # Reverse-proxy the API to the backend container. The frontend uses
    # same-origin relative URLs (window.STORMDOKU_API_URL = '') so /api and
    # /health must resolve to the Ktor server.
    location /api/ {
        proxy_pass http://backend:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Solving/grading a hard puzzle can take a while.
        proxy_read_timeout 120s;

        # Re-declare headers (nginx does not inherit add_header into locations
        # that define their own add_header).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security $strict_transport_security always;
    }

    location = /health {
        proxy_pass http://backend:8181/health;
    }

    # The compiled bundle is content-addressed by build; cache it aggressively.
    location = /web.js {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security $strict_transport_security always;
    }

    # SPA fallback: language routes such as /en/, /zh/, /de/ are client-side
    # (webpack historyApiFallback in dev) and must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
